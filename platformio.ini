; PlatformIO Project Configuration File}
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:striker]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = +<striker.cpp>
lib_deps = 
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BNO055
	servo
	wire
lib_extra_dirs = 
    lib/shared
    lib/striker


[env:goalkeeper]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = +<goalkeeper.cpp>
lib_deps =
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BNO08x
	servo
	wire

lib_extra_dirs =
	lib/shared
	lib/goalkeeper



; ── Shared base for all tests ──────────────────────────────────────────────
[test_base]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

[test_base_striker]
extends = test_base
lib_deps =
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BNO055
	servo
	wire

[test_base_goalkeeper]
extends = test_base
lib_deps =
	adafruit/Adafruit Unified Sensor
	adafruit/Adafruit BusIO
	adafruit/Adafruit BNO08x
	servo
	wire

; ── Striker tests ───────────────────────────────────────────────────────────
